<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugestão de presente - Amigo Secreto</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #faf7f2;
            background-image: 
                radial-gradient(at 15% 10%, rgba(185, 28, 28, 0.04) 0px, transparent 50%),
                radial-gradient(at 85% 20%, rgba(20, 83, 45, 0.05) 0px, transparent 50%),
                radial-gradient(at 50% 90%, rgba(217, 119, 6, 0.05) 0px, transparent 55%);
            -webkit-tap-highlight-color: transparent;
        }
        .font-festive { font-family: 'Playfair Display', serif; }
        .font-name { font-family: 'Lora', serif; }
        @keyframes fadePop {
            0% { opacity: 0; transform: translateY(2px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-save { animation: fadePop 0.2s ease-out forwards; }
    </style>
</head>
<body class="relative min-h-screen text-stone-800 flex flex-col items-center py-6 px-4 sm:py-10 overflow-x-hidden">

    <main class="relative z-10 w-full max-w-2xl">
        
        <!-- Cabeçalho -->
        <header class="relative overflow-hidden mb-7 bg-gradient-to-br from-[#143d29] via-[#184a32] to-[#0f2e1f] text-white p-6 sm:p-8 rounded-3xl shadow-lg border border-amber-500/30">
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-red-600 via-amber-400 to-red-600"></div>

            <div class="relative z-10 w-full flex flex-col items-center text-center">
                <div class="relative w-44 h-44 sm:w-52 sm:h-52 mx-auto mb-3 flex items-center justify-center pointer-events-none select-none">
                    <div class="absolute inset-4 rounded-full bg-amber-300/20 blur-xl"></div>
                    <img 
                        id="mascot-img"
                        src="https://i.postimg.cc/jdLYP5CP/Picsart-26-11-15-19-42-42-085.png" 
                        alt="Mascote Mamão Natalino" 
                        class="w-36 h-36 sm:w-44 sm:h-44 object-contain relative z-10 drop-shadow-xl translate-x-4 sm:translate-x-5"
                    />
                </div>

                <h1 class="w-full flex flex-col items-center text-center mb-2">
                    <span class="font-festive text-3xl sm:text-4xl font-bold text-amber-50 tracking-tight leading-tight">
                        Amigo Secreto
                    </span>
                    <span class="mt-1 text-lg sm:text-xl font-medium text-amber-200/95 tracking-wide">
                        Sugestão de presente
                    </span>
                </h1>

                <div class="mt-2 inline-flex items-center justify-center gap-2 px-4 py-1.5 rounded-full bg-amber-400/15 border border-amber-300/40 text-amber-200 text-xs sm:text-sm font-medium shadow-sm backdrop-blur-sm">
                    <svg class="w-4 h-4 text-amber-300 shrink-0" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                    </svg>
                    <span>Valor mínimo R$ 50,00, o limite é teu coração</span>
                </div>
            </div>
        </header>

        <!-- Lista de Participantes -->
        <section id="gift-list" class="space-y-3" aria-label="Lista de participantes do amigo secreto">
        </section>

        <footer class="mt-9 text-center text-xs text-stone-400">
            <span>Boas Festas · Amigo Secreto</span>
        </footer>

    </main>

    <!-- Sincronização Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const PARTICIPANTS = [
            { id: 'agata', name: 'Ágata', borderLeft: 'border-l-red-700', nameColor: 'text-red-900', focusInput: 'focus:border-red-700' },
            { id: 'beth', name: 'Beth', borderLeft: 'border-l-emerald-800', nameColor: 'text-emerald-950', focusInput: 'focus:border-emerald-800' },
            { id: 'carine', name: 'Carine', borderLeft: 'border-l-amber-600', nameColor: 'text-amber-900', focusInput: 'focus:border-amber-600' },
            { id: 'eni', name: 'Eni', borderLeft: 'border-l-red-700', nameColor: 'text-red-900', focusInput: 'focus:border-red-700' },
            { id: 'gui', name: 'Gui', borderLeft: 'border-l-emerald-800', nameColor: 'text-emerald-950', focusInput: 'focus:border-emerald-800' },
            { id: 'guto', name: 'Guto', borderLeft: 'border-l-amber-600', nameColor: 'text-amber-900', focusInput: 'focus:border-amber-600' },
            { id: 'jonatas', name: 'Jonatas', borderLeft: 'border-l-red-700', nameColor: 'text-red-900', focusInput: 'focus:border-red-700' },
            { id: 'juliano', name: 'Juliano', borderLeft: 'border-l-emerald-800', nameColor: 'text-emerald-950', focusInput: 'focus:border-emerald-800' },
            { id: 'manuela', name: 'Manuela', borderLeft: 'border-l-amber-600', nameColor: 'text-amber-900', focusInput: 'focus:border-amber-600' },
            { id: 'martim', name: 'Martim', borderLeft: 'border-l-red-700', nameColor: 'text-red-900', focusInput: 'focus:border-red-700' },
            { id: 'mateus', name: 'Mateus', borderLeft: 'border-l-emerald-800', nameColor: 'text-emerald-950', focusInput: 'focus:border-emerald-800' },
            { id: 'paulo', name: 'Paulo', borderLeft: 'border-l-amber-600', nameColor: 'text-amber-900', focusInput: 'focus:border-amber-600' },
            { id: 'rita', name: 'Rita', borderLeft: 'border-l-red-700', nameColor: 'text-red-900', focusInput: 'focus:border-red-700' },
            { id: 'tainha', name: 'Tainha', borderLeft: 'border-l-emerald-800', nameColor: 'text-emerald-950', focusInput: 'focus:border-emerald-800' },
            { id: 'thales', name: 'Thales', borderLeft: 'border-l-amber-600', nameColor: 'text-amber-900', focusInput: 'focus:border-amber-600' },
            { id: 'zoza', name: 'Zoza', borderLeft: 'border-l-red-700', nameColor: 'text-red-900', focusInput: 'focus:border-red-700' }
        ];

        const MAX_WORDS = 7;
        const listContainer = document.getElementById('gift-list');
        const state = {};
        PARTICIPANTS.forEach(p => { state[p.id] = ''; });
        const saveTimers = {};

        function getWords(text) {
            const trimmed = text.trim();
            if (!trimmed) return [];
            return trimmed.split(/\s+/);
        }

        function enforceSilentWordLimit(rawText) {
            const words = getWords(rawText);
            if (words.length > MAX_WORDS) {
                return words.slice(0, MAX_WORDS).join(' ');
            }
            if (words.length === MAX_WORDS && /\s$/.test(rawText)) {
                return rawText.trimEnd();
            }
            return rawText;
        }

        function updateItemUI(id, text, isRemoteUpdate = false) {
            const input = document.getElementById(`input-${id}`);
            if (!input) return;
            if (isRemoteUpdate && document.activeElement === input) return;
            if (input.value !== text) input.value = text;
            if (isRemoteUpdate) showSavedStatus(id, 'Atualizado');
        }

        function showSavedStatus(id, label = 'Salvo') {
            const statusDesktop = document.getElementById(`status-desktop-${id}`);
            const statusMobile = document.getElementById(`status-mobile-${id}`);
            const badgeHTML = `
                <span class="inline-flex items-center gap-1 text-emerald-800 bg-emerald-50 border border-emerald-200/90 px-2 py-0.5 rounded-full text-[11px] font-medium animate-save">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                    </svg>
                    ${label}
                </span>
            `;
            [statusDesktop, statusMobile].forEach(el => {
                if (!el) return;
                el.innerHTML = badgeHTML;
                clearTimeout(el.hideTimer);
                el.hideTimer = setTimeout(() => { el.innerHTML = ''; }, 2000);
            });
        }

        function renderList() {
            listContainer.innerHTML = '';
            PARTICIPANTS.forEach(person => {
                const card = document.createElement('div');
                card.className = `bg-[#fffdf9] hover:bg-white p-3.5 sm:px-5 sm:py-4 rounded-2xl shadow-sm border border-stone-200/85 border-l-4 ${person.borderLeft} transition-all focus-within:ring-4 focus-within:ring-amber-900/5`;
                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
                        <div class="flex items-center justify-between sm:w-32 shrink-0">
                            <span class="font-name font-bold text-lg ${person.nameColor} tracking-tight">
                                ${person.name}
                            </span>
                            <div id="status-mobile-${person.id}" class="sm:hidden h-5 flex items-center"></div>
                        </div>
                        <div class="flex-1 relative flex items-center">
                            <input 
                                type="text" 
                                id="input-${person.id}" 
                                value=""
                                placeholder="Escreva sua sugestão aqui..." 
                                autocomplete="off"
                                aria-label="Sugestão de presente para ${person.name}"
                                class="w-full bg-stone-50/90 hover:bg-stone-100/70 focus:bg-white text-stone-800 placeholder-stone-400 text-base rounded-xl pl-3.5 pr-20 sm:pr-24 py-2.5 border border-stone-200 ${person.focusInput} focus:outline-none transition-colors"
                            />
                            <div id="status-desktop-${person.id}" class="hidden sm:flex items-center absolute right-2.5 pointer-events-none"></div>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
                const inputEl = document.getElementById(`input-${person.id}`);
                inputEl.addEventListener('input', (e) => {
                    const limitedText = enforceSilentWordLimit(e.target.value);
                    if (e.target.value !== limitedText) e.target.value = limitedText;
                    state[person.id] = limitedText;
                    triggerSave(person.id, limitedText);
                });
            });
        }

        let db = null;
        let currentUser = null;

        const firebaseConfig = {
          apiKey: "AIzaSyBQgWtbg0-mfi7wUPzQtYIEvGzxLSimxoU",
          authDomain: "amigo-secreto-224a0.firebaseapp.com",
          projectId: "amigo-secreto-224a0",
          storageBucket: "amigo-secreto-224a0.firebasestorage.app",
          messagingSenderId: "28668569979",
          appId: "1:28668569979:web:e1dab94a4335bbc6f575de",
          measurementId: "G-TYL1PTD0BY"
        };

        function triggerSave(id, text) {
            clearTimeout(saveTimers[id]);
            saveTimers[id] = setTimeout(async () => {
                if (db && currentUser) {
                    try {
                        const docRef = doc(db, 'amigo_secreto_presentes', id);
                        await setDoc(docRef, { text: text, updatedAt: Date.now() }, { merge: true });
                        showSavedStatus(id, 'Salvo');
                    } catch (err) {
                        console.error('Erro ao salvar:', err);
                        showSavedStatus(id, 'Salvo');
                    }
                } else {
                    showSavedStatus(id, 'Salvo');
                }
            }, 350);
        }

        async function initRealtimeSync() {
            try {
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                db = getFirestore(app);

                const cred = await signInAnonymously(auth);
                currentUser = cred.user;

                if (!currentUser) return;

                const colRef = collection(db, 'amigo_secreto_presentes');
                onSnapshot(colRef, (snapshot) => {
                    snapshot.docChanges().forEach((change) => {
                        const docId = change.doc.id;
                        const data = change.doc.data();
                        if (data && typeof data.text === 'string' && Object.prototype.hasOwnProperty.call(state, docId)) {
                            const safeText = enforceSilentWordLimit(data.text);
                            state[docId] = safeText;
                            updateItemUI(docId, safeText, true);
                        }
                    });
                }, (error) => {
                    console.error('Erro na sincronização:', error);
                });
            } catch (error) {
                console.warn('Modo local ativado:', error);
            }
        }

        // Executa a renderização dos nomes na tela
        renderList();
        initRealtimeSync();
    </script>
</body>
</html>
